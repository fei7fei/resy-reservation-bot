[server]
address = "localhost"     # only this PC can open the app (it holds your Resy token)
port = 8502
headless = true           # launch_app.pyw opens the browser itself

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # hide the Deploy button

# Indigo accent for buttons and selections (distinct from the red/blue availability colors).
# Set per mode so the app still follows the system's light/dark setting.
[theme.light]
primaryColor = "#5b5bd6"

[theme.dark]
primaryColor = "#7c7cf0"
